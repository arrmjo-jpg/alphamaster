# The reverse proxy, and the reason the Admin and the API share one origin.
#
# One server block answers for both: paths belonging to the backend go to PHP-FPM,
# everything else goes to the container serving the Admin bundle. A browser
# therefore sees a single origin, which is what lets the session travel in a
# SameSite=Strict cookie at all (ADR 0042) — split the two across ports or hosts and
# the browser stops sending it, and no amount of frontend configuration brings it
# back.
#
# Nothing here reads a file. That is possible because ADR 0001 makes the backend
# API-only: there are no Blade views to render and no built assets to serve, so
# backend/public holds index.php and the remains of the Laravel scaffold and
# nothing this server would ever hand to a client.
#
# The previous configuration set `root` to the application's public directory
# and reached it through try_files, which meant this container had to mount the
# backend working tree — coupling the proxy to the filesystem of the service it
# proxies rather than to its network interface. Passing FPM a fixed
# SCRIPT_FILENAME removes that: the path is resolved inside the backend
# container, against the copy of the application baked into its own image, and
# this container needs no application file at all.

server {
    listen 80;
    server_name localhost;

    charset utf-8;

    # The upload ceiling, and it belongs here as much as in PHP because nginx
    # refuses an oversized body before the application ever sees it — with its own
    # HTML 413, not the platform's error envelope. The default is 1m, which silently
    # capped every upload at a hundredth of what `POST /media` validates and
    # publishes: nothing in the application could report that, because nothing in
    # the application was reached.
    #
    # 101m rather than 100m: the rule is `max:102400` kilobytes, which is 100 MiB of
    # file, and the multipart envelope around it also counts toward this limit. The
    # margin means the application refuses an oversized file with a message, which is
    # the behaviour worth having, instead of nginx refusing it with a status line.
    client_max_body_size 101m;

    # Security headers, inherited by the locations below because none of them
    # declares an add_header of its own.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Answered by this server, so an orchestrator can tell that the proxy itself
    # is up without the backend having to be.
    location /health {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    # Dotfiles never reach PHP. Laravel would answer 404 for them anyway; this
    # refuses them a request earlier and more plainly.
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # The backend's own path space, named explicitly rather than by exclusion.
    #
    # /api is the contract. /docs is the generated reference, and /_scramble is the
    # tooling that produces it in development — both belong to the backend, and
    # routing them here keeps them reachable now that / no longer goes to PHP.
    #
    # A regex location, so it is matched before the prefix location below whatever
    # order they appear in.
    location ~ ^/(api|docs|_scramble)(/|$) {
        fastcgi_pass backend:9000;

        include fastcgi_params;

        # After the include, so these win over what it sets. The path is
        # absolute and fixed: it names a file in the backend container's
        # filesystem, which is the only place the application exists.
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME     /index.php;
        fastcgi_param DOCUMENT_ROOT   /var/www/html/public;

        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60;
    }

    # Everything else is the Admin. It is a separate container holding a static
    # bundle, reached over the edge network — the proxy does not read its files, so
    # the two images stay independently deployable.
    location / {
        proxy_pass http://admin:80;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
