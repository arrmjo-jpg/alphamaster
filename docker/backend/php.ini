[PHP]
memory_limit = 512M
max_execution_time = 60
; Matched to what `POST /media` validates (`max:102400` kilobytes = 100 MiB) and to
; nginx's client_max_body_size. Below it PHP discards the file and leaves an empty
; $_FILES, so the request arrives looking as though no file was sent at all — the
; operator is told the field is required, which is true and useless. post_max_size
; carries the multipart envelope as well, so it sits a megabyte higher.
upload_max_filesize = 100M
post_max_size = 101M
expose_php = Off
date.timezone = UTC

[Opcache]
opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.revalidate_freq = 0
opcache.validate_timestamps = 1
opcache.save_comments = 1
opcache.fast_shutdown = 1
