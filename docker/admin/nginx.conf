# Serving the Admin bundle. Files only — this server never reaches the API.
#
# The edge proxy owns routing: it sends /api to the backend and everything else
# here. So this container has no upstream, no proxy_pass and no reason to be on any
# network but the edge one.

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;

    # Lets an orchestrator distinguish "the bundle is being served" from "the proxy
    # is up", which are different failures.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    # Vite fingerprints every asset it emits, so a given URL's content never
    # changes and a year is safe. index.html is the opposite: it names those
    # fingerprints, so caching it is how a browser ends up asking for a bundle that
    # no longer exists.
    location /assets/ {
        access_log off;
        # One header, not `expires` as well: that directive emits a Cache-Control of
        # its own, and the response then carries two of them.
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # A client-side router owns the path space, so an unknown path is a route the
    # application will resolve rather than a missing file. The bundle is still
    # served with a 200 because that is what the browser needs to boot it.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
